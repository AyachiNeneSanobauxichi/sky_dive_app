name: happy_os
description: "HappyOS is an AI-powered app that generates personalized, thrilling stories based on the user's own life experiences."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  animations: ^2.2.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  # ⚠️ 上限锁死在 <3.3.0：riverpod_generator <4.0.6（当前 Dart 3.10.1 能用的最高版本）
  # 要求 riverpod <=3.2.0。升到 3.3.x 会让 riverpod_generator 无解。
  # 解锁前提：Flutter SDK 升到带 Dart >=3.12.0 的版本，详见 .claude/skills/flutter-best-practices/references/12-code-generation.md
  flutter_riverpod: ">=3.0.0 <3.3.0"
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  gpt_markdown: ^1.1.8
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.7.0
  lucide_icons_flutter: ^3.1.15
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^4.0.0
  skeletonizer: ^2.1.3
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  # ⚠️ 上限锁死在 <4.0.6：4.0.6+ 要求 Dart SDK >=3.12.0，当前是 3.10.1。
  # 注意 riverpod_lint 无论哪个版本都装不上（同样卡 Dart 3.12），故未引入。
  riverpod_generator: <4.0.6

flutter:
  uses-material-design: true
  generate: true # 开启 gen-l10n：根据 lib/l10n/*.arb 生成 AppLocalizations
  assets:
    - .env # dotenv 运行时读取的环境配置（需注册为 asset 才能被 rootBundle 加载）

  # 只打包拉丁字体（合计约 1.5MB）；中文交给系统字体回退，
  # 见 lib/core/theme/app_text_styles.dart 的 HappyFonts.textFallback。
  fonts:
    # 界面与正文。由 Inter 可变字体实例化出的静态字重（opsz 固定 16）。
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # 叙事标题。⚠️ 只有 Regular，写 w700 会触发系统伪粗体，禁止。
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          weight: 400
          style: italic
