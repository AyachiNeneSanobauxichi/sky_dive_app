name: happy_os
description: "HappyOS is an AI-powered app that generates personalized, thrilling stories based on the user's own life experiences."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.7.0
  pretty_dio_logger: ^1.4.0
  skeletonizer: ^2.1.3
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  generate: true # 开启 gen-l10n：根据 lib/l10n/*.arb 生成 AppLocalizations
  assets:
    - .env # dotenv 运行时读取的环境配置（需注册为 asset 才能被 rootBundle 加载）
