name: sky_dive
description: "SkyDive is the customer-facing app of a Japanese skydiving operator: browse drop zones and jump routes, book a slot, and manage your jump log."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  animations: ^2.2.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  # ⚠️ 上限锁死在 <3.3.0：riverpod_generator <4.0.6（当前 Dart 3.10.1 能用的最高版本）
  # 要求 riverpod <=3.2.0。升到 3.3.x 会让 riverpod_generator 无解。
  # 解锁前提：Flutter SDK 升到带 Dart >=3.12.0 的版本，详见 .claude/skills/flutter-best-practices/references/12-code-generation.md
  flutter_riverpod: ">=3.0.0 <3.3.0"
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  form_builder_validators: ^11.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.7.0
  lucide_icons_flutter: ^3.1.15
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^4.0.0
  skeletonizer: ^2.1.3
  toastification: ^3.2.0

dev_dependencies:
  # 本项目不写自动化测试（无 test/ 目录），故不引 flutter_test。
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  # ⚠️ 上限锁死在 <4.0.6：4.0.6+ 要求 Dart SDK >=3.12.0，当前是 3.10.1。
  # 注意 riverpod_lint 无论哪个版本都装不上（同样卡 Dart 3.12），故未引入。
  riverpod_generator: <4.0.6

flutter:
  uses-material-design: true
  generate: true # 开启 gen-l10n：根据 lib/l10n/*.arb 生成 AppLocalizations
  assets:
    - .env # dotenv 运行时读取的环境配置（需注册为 asset 才能被 rootBundle 加载）
    - assets/images/ # 品牌 logo 标记，见 lib/shared/widgets/brand/sky_brand_mark.dart

  # 只打包拉丁字体（约 700KB）；日文 / 中文交给系统字体回退，
  # 见 lib/core/theme/app_text_styles.dart 的 SkyFonts.textFallback。
  #
  # 只有 Inter 一族：航空主题要的是仪表盘式的中性无衬线体，
  # 标题层级靠字号 + 字重 + 负字距拉开，不再引第二种字体族。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
